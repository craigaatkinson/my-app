
version: '3.8'

services:
  php:
    build: ./php
    volumes:
      - ./:/var/www/html
      - ./database:/var/www/html/database
    environment:
      - APP_ENV=local
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - DB_DATABASE=/var/www/html/database/atransport.sqlite
      # MySQL config (if needed)
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-Atransport}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-newell29}
    # Uncomment if using MySQL
    # depends_on:
    #   - db
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL service (optional - uncomment if needed)
  # db:
  #   image: mysql:8.0
  #   ports:
  #     - "3307:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-newell29}
  #     MYSQL_DATABASE: ${DB_NAME:-Atransport}
  #   volumes:
  #     - db_data:/var/lib/mysql
  #     - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql:ro
  #   networks:
  #     - app-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
networks:
  app-network:
    driver: bridge

volumes:
  db_data:

